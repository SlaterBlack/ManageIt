<header class="navbar">
  <a
    class="navbar-brand"
    routerLink="/overview"
    aria-label="ManageIt home"
  >ManageIt</a>
  <nav class="navbar-links" aria-label="Main navigation">
    <a
      routerLink="/overview"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Overview</a>
    <a
      routerLink="/projects"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Projects</a>
    <a
      routerLink="/calendar"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Calendar</a>
  </nav>
  <div class="navbar-user">
    <span class="navbar-username">{{ auth.currentUser()?.name || 'Team member' }}</span>
    <button class="navbar-logout" type="button" (click)="logout()">Log out</button>
  </div>
</header>
<main class="app-main">
  <router-outlet />
</main>
